{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopkeeper Login - {{ theater.name }}</title>
    <link rel="stylesheet" href="{% static 'css/app_design.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .admin-desk-frame {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
            padding: 40px;
            box-sizing: border-box;
        }
        .admin-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }
        .admin-input-wrapper::before {
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
        }
        .icon-user::before { content: "\f007"; font-weight: 400; }
        .icon-lock::before { content: "\f023"; }
        .admin-input {
            width: 100%;
            padding: 16px 16px 16px 50px;
            border-radius: 14px;
            border: 1.5px solid #e2e8d5;
            background: #fafbf8;
            font-size: 15px;
            color: var(--text-dark);
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .admin-input:focus {
            border-color: #2e7d32;
            background: #fff;
        }
        .admin-btn {
            width: 100%;
            padding: 16px;
            background: #2e7d32;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
            transition: background 0.2s;
        }
        .admin-btn:hover {
            background: #256628;
        }
    </style>
</head>
<body>
    <div class="admin-desk-frame">
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="background: #f1f8ed; width: 64px; height: 64px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; color: #2e7d32; font-size: 28px; margin-bottom: 16px;">
                <i class="fa-solid fa-store"></i>
            </div>
            <div style="font-size: 11px; font-weight: 800; color: #2e7d32; text-transform: uppercase; letter-spacing: 1px;">SHOPKEEPER PORTAL</div>
            <h1 style="font-size: 24px; font-weight: 900; color: var(--text-dark); margin: 6px 0 4px 0;">{{ theater.name }}</h1>
            <div style="font-size: 13px; color: var(--text-muted);">Sign in to manage incoming orders & inventory</div>
        </div>

        {% if error %}
        <div style="background: #fde8e8; color: #c53030; padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="admin-input-wrapper icon-user">
                <input type="text" name="username" class="admin-input" placeholder="Username" required>
            </div>
            <div class="admin-input-wrapper icon-lock" style="margin-bottom: 24px;">
                <input type="password" name="password" class="admin-input" placeholder="Password" required>
            </div>
            <button type="submit" class="admin-btn">Login to Dashboard &nbsp;<i class="fa-solid fa-arrow-right"></i></button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 12px; color: var(--text-muted);">
            Optimized for Tablet & Desktop Management
        </div>
    </div>
</body>
</html>
